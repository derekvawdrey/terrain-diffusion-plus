def terrainDiffusionVersions = [
        '1.20.1' : [taskName: 'Mc1201'],
        '1.21.1' : [taskName: 'Mc1211'],
        '1.21.11': [taskName: 'Mc12111']
]

def terrainDiffusionRuntimeVariants = [
        windows: [taskSuffix: 'Windows', targetTask: 'buildWindows', displayName: 'Windows / DirectML'],
        cuda   : [taskSuffix: 'Cuda', targetTask: 'buildCuda', displayName: 'CUDA'],
        cpu    : [taskSuffix: 'Cpu', targetTask: 'buildCpu', displayName: 'CPU / CoreML']
]

def terrainDiffusionTaskGroup = 'terrain diffusion multiversion'

def terrainDiffusionGradlewExecutable = providers.provider {
    String wrapperName = System.getProperty('os.name').toLowerCase().startsWith('windows') ? 'gradlew.bat' : 'gradlew'
    return rootProject.file(wrapperName).absolutePath
}

def terrainDiffusionRegisterVersionBuild = { String taskName, String mcVersion, String targetTask, String descriptionText ->
    tasks.register(taskName, Exec) {
        group = terrainDiffusionTaskGroup
        description = descriptionText
        workingDir rootProject.file("versions/${mcVersion}")
        commandLine terrainDiffusionGradlewExecutable.get(), (targetTask.startsWith(':') ? targetTask : ":${targetTask}")
    }
}

terrainDiffusionVersions.each { String mcVersion, Map cfg ->
    terrainDiffusionRegisterVersionBuild(
            "build${cfg.taskName}",
            mcVersion,
            'buildAllVariants',
            "Builds every configured loader/runtime variant for Minecraft ${mcVersion}."
    )

    terrainDiffusionRuntimeVariants.each { String variantName, Map variant ->
        terrainDiffusionRegisterVersionBuild(
                "build${cfg.taskName}${variant.taskSuffix}",
                mcVersion,
                variant.targetTask,
                "Builds every configured loader for Minecraft ${mcVersion} using the ${variant.displayName} runtime."
        )
    }
}

tasks.register('cleanAllVersions') {
    group = terrainDiffusionTaskGroup
    description = 'Runs clean in every version build without configuring the other versions in this root build.'
    dependsOn terrainDiffusionVersions.collect { String mcVersion, Map cfg ->
        String cleanTaskName = "clean${cfg.taskName}"
        terrainDiffusionRegisterVersionBuild(
                cleanTaskName,
                mcVersion,
                'clean',
                "Runs clean for Minecraft ${mcVersion}."
        )
        cleanTaskName
    }
}
