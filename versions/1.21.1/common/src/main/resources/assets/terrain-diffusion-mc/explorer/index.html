<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrain Explorer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #161924;
    --card: #1e2235;
    --border: #2d3458;
    --accent: #4f8ef7;
    --accent-dim: #1e3570;
    --text: #e2e8f0;
    --muted: #6b7a99;
    --highlight: #f97316;
    --track: #2a2f4a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── App layout ── */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar h1 {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.03em;
  }

  .section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Seed ── */
  .seed-display {
    font-size: 18px;
    font-weight: 600;
    font-family: monospace;
    color: var(--text);
  }

  .seed-row {
    display: flex;
    gap: 6px;
  }

  /* ── Channel buttons ── */
  .channel-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* ── Filter ── */
  .filter-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    width: 14px;
    height: 14px;
  }

  .fch {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
  }

  .fch-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .fch-name {
    font-weight: 600;
    font-size: 12px;
  }

  .fch-vals {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-family: monospace;
    color: var(--accent);
    margin-top: 4px;
  }

  /* Dual-range slider */
  .dual-range {
    position: relative;
    height: 20px;
  }

  .dual-range .track-bg {
    position: absolute;
    top: 9px;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--track);
    border-radius: 2px;
    pointer-events: none;
  }

  .dual-range .track-fill {
    position: absolute;
    top: 9px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    pointer-events: none;
  }

  .dual-range input[type="range"] {
    position: absolute;
    width: 100%;
    height: 20px;
    top: 0;
    background: transparent;
    pointer-events: none;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
  }

  .dual-range input[type="range"]::-webkit-slider-thumb {
    pointer-events: all;
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .dual-range input[type="range"]::-moz-range-thumb {
    pointer-events: all;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  .dual-range input[type="range"]:disabled::-webkit-slider-thumb {
    background: var(--muted);
    box-shadow: none;
  }

  .fch-hint {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 4px 0 2px;
  }

  /* ── Map area ── */
  .map-area {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    min-width: 0;
    min-height: 0;
  }

  .map-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .panel-header {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .panel-title { font-weight: 600; font-size: 12px; flex-shrink: 0; }

  .panel-info {
    color: var(--muted);
    font-size: 11px;
    font-family: monospace;
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  /* nav grid (pan buttons around map) */
  .nav-grid {
    display: grid;
    grid-template-columns: 28px 1fr 28px;
    grid-template-rows: 28px 1fr 28px;
    flex: 1;
    min-height: 0;
    padding: 5px;
    gap: 3px;
  }

  .pan-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    width: 100%;
    height: 100%;
    transition: background 0.12s;
  }
  .pan-btn:hover { background: var(--accent-dim); border-color: var(--accent); }
  .pan-btn:active { background: var(--accent); }

  .map-container {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    overflow: hidden;
    background: #090b11;
    border-radius: 3px;
    cursor: crosshair;
  }

  .map-img {
    width: 100%;
    height: 100%;
    display: block;
    transition: opacity 0.2s;
  }

  .map-img.loading { opacity: 0.35; }

  #coarse-img { image-rendering: pixelated; }

  .map-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
  }

  .spinner {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tile-marker {
    position: absolute;
    border: 2px solid var(--highlight);
    box-shadow: 0 0 0 1px rgba(249,115,22,0.3);
    pointer-events: none;
    display: none;
    z-index: 4;
  }

  .origin-marker {
    position: absolute;
    pointer-events: none;
    display: none;
    z-index: 5;
  }

  .origin-marker.inside {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #facc15;
    border: 2px solid #090b11;
    box-shadow: 0 0 0 2px rgba(250,204,21,0.35), 0 0 12px rgba(250,204,21,0.45);
    transform: translate(-50%, -50%);
  }

  .origin-marker.edge {
    width: 22px;
    height: 22px;
    color: #facc15;
    font-size: 22px;
    line-height: 22px;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    transform: translate(-50%, -50%) rotate(var(--marker-angle, 0rad));
  }

  .origin-marker.edge::before { content: '▲'; }

  .btn-up    { grid-column: 2; grid-row: 1; }
  .btn-down  { grid-column: 2; grid-row: 3; }
  .btn-left  { grid-column: 1; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }

  /* ── Generic controls ── */
  input[type="number"], input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 4px 7px;
    font-size: 12px;
    outline: none;
    flex: 1;
    min-width: 0;
  }
  input[type="number"]:focus, input[type="text"]:focus { border-color: var(--accent); }

  button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  button:hover { background: var(--accent-dim); border-color: var(--accent); }
  button:active { background: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: 0.85; }

  button.fch-clear {
    padding: 0 6px;
    font-size: 13px;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: none;
    min-width: 20px;
  }
  button.fch-clear:hover { color: var(--text); background: transparent; }

  /* ── Status bar ── */
  .status-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 3px 14px;
    color: var(--muted);
    font-size: 11px;
    font-family: monospace;
    flex-shrink: 0;
  }

  /* ── Hover tooltip ── */
  .hover-tooltip {
    position: fixed;
    background: rgba(10, 12, 22, 0.95);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 14px;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.7;
    pointer-events: none;
    display: none;
    z-index: 200;
    min-width: 180px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .hover-tooltip .ht-coord {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .hover-tooltip .ht-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  .hover-tooltip .ht-label { color: var(--muted); }
  .hover-tooltip .ht-val   { color: var(--text); font-weight: 600; }

  /* ── Coordinate Helper ── */
  .coord-scale-btns { display: flex; gap: 4px; }
  .coord-scale-btn {
    flex: 1;
    padding: 3px 0;
    font-size: 11px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
  }
  .coord-scale-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .coord-block-size { font-size: 11px; color: var(--muted); }
  .coord-scale-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .coord-scale-track {
    flex: 1;
    height: 8px;
    position: relative;
    border-left: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
    border-radius: 0 0 2px 2px;
  }
  .coord-scale-fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    background: var(--accent);
    opacity: 0.3;
    border-radius: 0 0 2px 2px;
    width: 0;
  }
  .coord-scale-lbl { font-size: 11px; color: var(--accent); white-space: nowrap; font-weight: 600; }
  .coord-hint      { font-size: 11px; color: var(--muted); font-style: italic; }
  .coord-xyz { display: flex; flex-direction: column; gap: 3px; }
  .coord-xy-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
  }
  .coord-xy-lbl { color: var(--muted); }
  .coord-xy-val { font-family: monospace; color: var(--text); font-weight: 600; }
  .coord-tp {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font-family: monospace;
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
    user-select: all;
  }
  .coord-tp:hover { border-color: var(--accent); }
  .coord-tp-copied { border-color: #22c55e !important; color: #22c55e; }

  /* ── Biome Config ── */
  select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
    font-family: inherit;
    width: 100%;
  }
  select:focus { border-color: var(--accent); outline: none; }

  .bc-list {
    max-height: 160px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--card);
  }

  .bc-item {
    padding: 5px 8px;
    font-size: 11px;
    font-family: monospace;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .bc-item:last-child { border-bottom: none; }
  .bc-item:hover { background: var(--accent-dim); }
  .bc-item.selected { background: var(--accent); color: #fff; }

  .bc-item .bc-key {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bc-item .bc-badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .bc-item .bc-badge.configured { background: var(--accent-dim); color: var(--accent); }
  .bc-item .bc-badge.unconfigured { background: var(--track); color: var(--muted); }

  .bc-field { display: flex; flex-direction: column; gap: 3px; }
  .bc-field label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .bc-selected-key {
    font-family: monospace;
    font-size: 11px;
    color: var(--accent);
    word-break: break-all;
  }

  .bc-actions { display: flex; gap: 6px; }
  .bc-actions button { flex: 1; }

  .bc-result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bc-result pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px;
    font-size: 10px;
    overflow-x: auto;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .bc-status { font-weight: 700; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
  .bc-status.pass { background: #16351f; color: #4ade80; }
  .bc-status.fail { background: #3a1620; color: #f87171; }

  .bc-hint { font-size: 10px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <h1>Terrain Explorer</h1>

    <!-- Seed -->
    <div class="section">
      <div class="section-title">Seed</div>
      <div class="seed-display" id="seed-display">—</div>
      <div class="seed-row">
        <input type="number" id="seed-input" placeholder="Enter seed…">
        <button id="btn-set-seed" class="primary">Set</button>
      </div>
      <button id="btn-new-seed">Random</button>
    </div>

    <!-- Channel -->
    <div class="section">
      <div class="section-title">Coarse Channel</div>
      <div class="channel-grid" id="channel-buttons"></div>
    </div>

    <!-- Filter -->
    <div class="section">
      <div class="filter-header">
        <div class="section-title">Filter</div>
        <label class="toggle-label">
          <input type="checkbox" id="filter-enable">
          Enable
        </label>
      </div>
      <button id="btn-stats">Load Stats for Sliders</button>
      <div id="filter-channels"></div>
    </div>

    <!-- Coordinate Helper -->
    <div class="section">
      <div class="section-title">Coordinate Helper</div>
      <div class="coord-block-size" id="coord-block-size">—</div>
      <div class="coord-scale-row">
        <div class="coord-scale-track">
          <div class="coord-scale-fill" id="coord-scale-fill"></div>
        </div>
        <span class="coord-scale-lbl" id="coord-scale-lbl">—</span>
      </div>
      <div id="coord-rows"><span class="coord-hint">Click detail map to see coordinates</span></div>
    </div>

    <!-- Biome Config -->
    <div class="section">
      <div class="section-title">Biome Config</div>
      <input type="text" id="bc-search" placeholder="Search installed biomes…">
      <div class="bc-list" id="bc-list">
        <span class="bc-hint" style="padding:8px;display:block;">Loading biomes…</span>
      </div>

      <div id="bc-editor" style="display:none; flex-direction:column; gap:8px;">
        <div class="bc-selected-key" id="bc-selected-key">—</div>

        <div class="bc-field">
          <label>Zone</label>
          <select id="bc-zone">
            <option value="lowland">Lowland</option>
            <option value="mountain">Mountain</option>
            <option value="ocean">Ocean</option>
            <option value="beach">Beach</option>
            <option value="bareSlope">Bare Slope</option>
          </select>
        </div>

        <div class="bc-field">
          <label>Temperature</label>
          <select id="bc-temp">
            <option value="COLD">Cold</option>
            <option value="TEMPERATE" selected>Temperate</option>
            <option value="WARM">Warm</option>
            <option value="HOT">Hot</option>
          </select>
        </div>

        <div class="bc-field">
          <label>Moisture</label>
          <select id="bc-moisture">
            <option value="DRY">Dry</option>
            <option value="MODERATE" selected>Moderate</option>
            <option value="WET">Wet</option>
          </select>
        </div>

        <div class="bc-field">
          <label>Tree Density</label>
          <select id="bc-tree">
            <option value="BARE">Bare (no trees)</option>
            <option value="SPARSE">Sparse</option>
            <option value="FOREST" selected>Forest</option>
            <option value="DENSE">Dense</option>
            <option value="RAINFOREST">Rainforest</option>
          </select>
        </div>

        <div class="bc-field">
          <label>Rarity</label>
          <select id="bc-rarity">
            <option value="COMMON" selected>Common</option>
            <option value="UNCOMMON">Uncommon</option>
            <option value="RARE">Rare</option>
            <option value="VERY_RARE">Very Rare</option>
          </select>
        </div>

        <div class="bc-actions">
          <button id="bc-preview">Preview</button>
          <button id="bc-apply" class="primary" disabled>Apply</button>
        </div>

        <div class="bc-result" id="bc-result" style="display:none;"></div>
      </div>
    </div>
  </aside>

  <!-- ── Maps ── -->
  <div class="map-area">

    <!-- Coarse -->
    <div class="map-panel">
      <div class="panel-header">
        <span class="panel-title">Coarse Map</span>
        <button id="coarse-zoom-in">Zoom In</button>
        <button id="coarse-zoom-out">Zoom Out</button>
        <span class="coord-scale-lbl" id="coarse-zoom-label">100x100</span>
        <span class="panel-info" id="coarse-info">click a tile to load detail</span>
      </div>
      <div class="nav-grid">
        <button class="pan-btn btn-up"    id="coarse-up">↑</button>
        <button class="pan-btn btn-left"  id="coarse-left">←</button>
        <div class="map-container" id="coarse-container">
          <img id="coarse-img" class="map-img" alt="coarse map">
          <div class="tile-marker" id="tile-marker"></div>
          <div class="origin-marker" id="origin-marker" title="/td-explore origin"></div>
          <div class="spinner" id="coarse-spinner"></div>
          <div class="map-placeholder" id="coarse-placeholder">Loading…</div>
        </div>
        <button class="pan-btn btn-right" id="coarse-right">→</button>
        <button class="pan-btn btn-down"  id="coarse-down">↓</button>
      </div>
    </div>

    <!-- Detail -->
    <div class="map-panel">
      <div class="panel-header">
        <span class="panel-title">Detail Map</span>
        <button class="active" id="mode-relief">Relief</button>
        <button id="mode-elevation">Elevation</button>
        <button id="mode-temperature">Temperature</button>
        <button id="mode-biome">Biome</button>
        <span class="panel-info" id="detail-info">click coarse map to load</span>
      </div>
      <div class="nav-grid">
        <button class="pan-btn btn-up"    id="detail-up">↑</button>
        <button class="pan-btn btn-left"  id="detail-left">←</button>
        <div class="map-container" id="detail-container">
          <canvas id="detail-img" class="map-img" style="display:none"></canvas>
          <div class="spinner" id="detail-spinner"></div>
          <div class="map-placeholder" id="detail-placeholder">Click coarse map to generate</div>
        </div>
        <button class="pan-btn btn-right" id="detail-right">→</button>
        <button class="pan-btn btn-down"  id="detail-down">↓</button>
      </div>
    </div>

  </div><!-- .map-area -->
</div><!-- .layout -->

<div class="status-bar" id="status-bar">Connecting…</div>
<div class="hover-tooltip" id="hover-tooltip"></div>

<script>
  const COARSE_PAN_STEP = 20;
  const COARSE_WINDOW_MIN = 8;
  const COARSE_WINDOW_MAX = 120;
  const DETAIL_PAN_STEP = 256;
  const DETAIL_SIZE = 1024;

  const CHANNEL_META = [
    { ch: 0, name: 'Elev',    unit: 'm',  step: 50,   defMin: -8000, defMax: 8000 },
    { ch: 2, name: 'Temp',    unit: '°',  step: 1,    defMin: -30,   defMax: 40   },
    { ch: 3, name: 'T std',   unit: '°',  step: 0.5,  defMin: 0,     defMax: 20   },
    { ch: 4, name: 'Precip',  unit: '',   step: 10,   defMin: 0,     defMax: 2000 },
    { ch: 5, name: 'P CV',    unit: '',   step: 1,    defMin: 0,     defMax: 200  },
  ];

  const state = {
    seed: null,
    channel: 0,
    channels: [],
    biomes: {},
    biomeColors: {},
    nativeResolution: null,
    coordScale: 1,
    coarseOffsetI: 0,
    coarseOffsetJ: 0,
    coarseWindow: 50,
    coarseData: null,
    commandOrigin: null,
    detailRaw: null,
    detailCI: null,
    detailCJ: null,
    detailPanI: 0,
    detailPanJ: 0,
    detailMode: 'relief',
  };

  // ── DOM refs ──
  const seedDisplay     = document.getElementById('seed-display');
  const seedInput       = document.getElementById('seed-input');
  const btnSetSeed      = document.getElementById('btn-set-seed');
  const btnNewSeed      = document.getElementById('btn-new-seed');
  const channelButtons  = document.getElementById('channel-buttons');
  const filterEnable    = document.getElementById('filter-enable');
  const filterChannels  = document.getElementById('filter-channels');
  const btnStats        = document.getElementById('btn-stats');
  const coarseContainer = document.getElementById('coarse-container');
  const coarseImg       = document.getElementById('coarse-img');
  const coarseSpinner   = document.getElementById('coarse-spinner');
  const coarsePlaceholder = document.getElementById('coarse-placeholder');
  const coarseInfo      = document.getElementById('coarse-info');
  const coarseZoomLabel = document.getElementById('coarse-zoom-label');
  const tileMarker      = document.getElementById('tile-marker');
  const originMarker    = document.getElementById('origin-marker');
  const detailImg       = document.getElementById('detail-img');
  const detailSpinner   = document.getElementById('detail-spinner');
  const detailPlaceholder = document.getElementById('detail-placeholder');
  const detailInfo      = document.getElementById('detail-info');
  const statusBar       = document.getElementById('status-bar');
  const tooltip         = document.getElementById('hover-tooltip');
  const coordRows       = document.getElementById('coord-rows');
  const coordScaleFill  = document.getElementById('coord-scale-fill');
  const coordScaleLbl   = document.getElementById('coord-scale-lbl');
  const coordBlockSize  = document.getElementById('coord-block-size');

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  // ── Build filter channel widgets ──
  CHANNEL_META.forEach(({ ch, name, unit, step, defMin, defMax }) => {
    const div = document.createElement('div');
    div.className = 'fch';
    div.id = `fch-${ch}`;
    div.innerHTML = `
      <div class="fch-header">
        <span class="fch-name">${name}</span>
        <button class="fch-clear" title="Clear">×</button>
      </div>
      <div class="dual-range">
        <div class="track-bg"></div>
        <div class="track-fill" id="fch-${ch}-fill"></div>
        <input type="range" id="fch-${ch}-min" min="${defMin}" max="${defMax}" step="${step}" value="${defMin}">
        <input type="range" id="fch-${ch}-max" min="${defMin}" max="${defMax}" step="${step}" value="${defMax}">
      </div>
      <div class="fch-vals">
        <span id="fch-${ch}-min-val">—</span>
        <span id="fch-${ch}-max-val">—</span>
      </div>
      <div class="fch-hint" id="fch-${ch}-hint">Click "Load Stats" for accurate ranges</div>
    `;
    filterChannels.appendChild(div);

    const minEl  = document.getElementById(`fch-${ch}-min`);
    const maxEl  = document.getElementById(`fch-${ch}-max`);
    const fill   = document.getElementById(`fch-${ch}-fill`);
    const minVal = document.getElementById(`fch-${ch}-min-val`);
    const maxVal = document.getElementById(`fch-${ch}-max-val`);

    function updateFill() {
      const lo = parseFloat(minEl.value);
      const hi = parseFloat(maxEl.value);
      const rangeMin = parseFloat(minEl.min);
      const rangeMax = parseFloat(minEl.max);
      const span = rangeMax - rangeMin || 1;
      fill.style.left  = ((lo - rangeMin) / span * 100) + '%';
      fill.style.width = ((hi - lo) / span * 100) + '%';
      const prec = step < 1 ? 2 : 0;
      minVal.textContent = lo.toFixed(prec) + unit;
      maxVal.textContent = hi.toFixed(prec) + unit;
    }

    minEl.addEventListener('input', () => {
      if (parseFloat(minEl.value) > parseFloat(maxEl.value)) maxEl.value = minEl.value;
      updateFill();
      debouncedLoadCoarse();
    });
    maxEl.addEventListener('input', () => {
      if (parseFloat(maxEl.value) < parseFloat(minEl.value)) minEl.value = maxEl.value;
      updateFill();
      debouncedLoadCoarse();
    });
    div.querySelector('.fch-clear').addEventListener('click', () => {
      minEl.value = minEl.min;
      maxEl.value = minEl.max;
      updateFill();
      debouncedLoadCoarse();
    });

    updateFill();
  });

  // ── Coordinate helper ──
  function niceScaleKm(targetKm) {
    const options = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    return options.reduce((best, v) => Math.abs(v - targetKm) < Math.abs(best - targetKm) ? v : best);
  }

  function updateCoordScale() {
    const res = state.nativeResolution;
    if (!res) return;
    const scale = state.coordScale;
    const mPerBlock = res / scale;
    coordBlockSize.textContent = `1 block = ${mPerBlock % 1 === 0 ? mPerBlock : mPerBlock.toFixed(2)} m`;
    const totalKm = DETAIL_SIZE * res / scale / 1000;
    const barKm = niceScaleKm(totalKm * 0.25);
    coordScaleFill.style.width = (barKm / totalKm * 100).toFixed(1) + '%';
    coordScaleLbl.textContent = barKm >= 1 ? `${barKm} km` : `${barKm * 1000} m`;
  }

  function updateCoarseZoomLabel() {
    const size = state.coarseWindow * 2;
    coarseZoomLabel.textContent = `${size}x${size}`;
  }

  function setCoarseWindow(nextWindow) {
    const clamped = clamp(nextWindow, COARSE_WINDOW_MIN, COARSE_WINDOW_MAX);
    if (clamped === state.coarseWindow) return;
    state.coarseWindow = clamped;
    updateCoarseZoomLabel();
    if (!syncCoarseToDetailIfNeeded()) loadCoarse();
  }

  let _lastDetailClick = null;

  function showDetailCoords(row, col) {
    const { detailCI: ci, detailCJ: cj, detailPanI: pi, detailPanJ: pj, detailRaw } = state;
    if (ci === null || !detailRaw) return;
    _lastDetailClick = { row, col };
    const scale = state.coordScale;
    const centerI = ci * 256 * scale + pi;
    const centerJ = cj * 256 * scale + pj;
    const i1x = centerI - detailRaw.h / 2 + row;
    const j1x = centerJ - detailRaw.w / 2 + col;
    const mcX = Math.round(j1x);
    const mcZ = Math.round(i1x);
    const tp = `/tp ${mcX} ~ ${mcZ}`;
    coordRows.innerHTML = `
      <div class="coord-xyz">
        <div class="coord-xy-row"><span class="coord-xy-lbl">x (j)</span><span class="coord-xy-val">${mcX}</span></div>
        <div class="coord-xy-row"><span class="coord-xy-lbl">z (i)</span><span class="coord-xy-val">${mcZ}</span></div>
      </div>
      <div class="coord-tp" id="coord-tp-btn" title="Click to copy">${tp}</div>`;
    document.getElementById('coord-tp-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(tp).then(() => {
        const btn = document.getElementById('coord-tp-btn');
        btn.classList.add('coord-tp-copied');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('coord-tp-copied'); btn.textContent = tp; }, 1200);
      });
    });
  }

  // ── Debounce / request guards ──
  let debounceTimer = null;
  let coarseRequestSeq = 0;
  let detailRequestSeq = 0;
  let activeCoarseImageController = null;
  let activeDetailImageController = null;
  let activeDetailRawController = null;
  let coarseObjectUrl = null;
  let detailObjectUrl = null;

  function clearCoarseImage() {
    coarseImg.onload = null;
    coarseImg.onerror = null;
    if (coarseObjectUrl) URL.revokeObjectURL(coarseObjectUrl);
    coarseObjectUrl = null;
    coarseImg.removeAttribute('src');
    coarseImg.style.display = 'none';
  }

  function clearDetailImage() {
    detailImg.onload = null;
    detailImg.onerror = null;
    if (detailObjectUrl) URL.revokeObjectURL(detailObjectUrl);
    detailObjectUrl = null;
    const ctx = detailImg.getContext ? detailImg.getContext('2d') : null;
    if (ctx) ctx.clearRect(0, 0, detailImg.width || 0, detailImg.height || 0);
    detailImg.width = 0;
    detailImg.height = 0;
    detailImg.style.display = 'none';
  }

  function decodeBlobAsImage(blob) {
    if ('createImageBitmap' in window) return createImageBitmap(blob);
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode failed')); };
      img.src = url;
    });
  }

  function drawDetailImage(image) {
    const ctx = detailImg.getContext('2d', { alpha: false });
    detailImg.width = image.width;
    detailImg.height = image.height;
    ctx.clearRect(0, 0, detailImg.width, detailImg.height);
    ctx.drawImage(image, 0, 0);
    if (typeof image.close === 'function') image.close();
  }


  // ── Client-side detail rendering ──
  function parseBiomeColor(rawColor, fallback) {
    if (typeof rawColor === 'number' && Number.isFinite(rawColor)) return rawColor & 0xFFFFFF;
    if (typeof rawColor === 'string') {
      const clean = rawColor.startsWith('#') ? rawColor.slice(1) : rawColor;
      const parsed = parseInt(clean, 16);
      if (Number.isFinite(parsed)) return parsed & 0xFFFFFF;
    }
    return fallback;
  }

  function writeRGB(buf, idx, color, shade = 1) {
    buf[idx]     = clamp(((color >> 16) & 255) * shade, 0, 255);
    buf[idx + 1] = clamp(((color >> 8) & 255) * shade, 0, 255);
    buf[idx + 2] = clamp((color & 255) * shade, 0, 255);
    buf[idx + 3] = 255;
  }

  function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }

  function lerpColor(c1, c2, t) {
    t = clamp(t, 0, 1);
    const r = Math.round(lerp((c1 >> 16) & 255, (c2 >> 16) & 255, t));
    const g = Math.round(lerp((c1 >> 8) & 255, (c2 >> 8) & 255, t));
    const b = Math.round(lerp(c1 & 255, c2 & 255, t));
    return (r << 16) | (g << 8) | b;
  }

  function terrainBaseColor(e) {
    if (e < -800) return 0x071B3A;
    if (e < -120) return lerpColor(0x09285A, 0x185A8A, (e + 800) / 680);
    if (e < 0) return lerpColor(0x185A8A, 0x328CA8, (e + 120) / 120);
    if (e < 40) return lerpColor(0xD8C76A, 0x5E9F4A, e / 40);
    if (e < 900) return lerpColor(0x5E9F4A, 0x3F7135, (e - 40) / 860);
    if (e < 2200) return lerpColor(0x6F7A59, 0x8D8D84, (e - 900) / 1300);
    return lerpColor(0xA7A7A0, 0xE8EEEE, (e - 2200) / 1600);
  }

  function heatColor(t) {
    if (t < 0.5) return lerpColor(0x283C9A, 0xE6EDF2, t / 0.5);
    return lerpColor(0xE6EDF2, 0x9F1D1D, (t - 0.5) / 0.5);
  }

  function viridisish(t) {
    if (t < 0.33) return lerpColor(0x440154, 0x31688E, t / 0.33);
    if (t < 0.66) return lerpColor(0x31688E, 0x35B779, (t - 0.33) / 0.33);
    return lerpColor(0x35B779, 0xFDE725, (t - 0.66) / 0.34);
  }

  function arrayMinMax(arr) {
    let min = Infinity, max = -Infinity;
    for (let i = 0; i < arr.length; i++) {
      const v = arr[i];
      if (!Number.isFinite(v)) continue;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    if (!Number.isFinite(min) || !Number.isFinite(max) || min === max) return [0, 1];
    return [min, max];
  }

  function biomeColor(index) {
    const raw = state.biomeColors[String(index)];
    return parseBiomeColor(raw, 0x8DB360);
  }

  function renderDetailFromRaw() {
    const raw = state.detailRaw;
    if (!raw) return;
    const { elev, temp, biome, water, h, w } = raw;
    const ctx = detailImg.getContext('2d', { alpha: false });
    if (detailImg.width !== w) detailImg.width = w;
    if (detailImg.height !== h) detailImg.height = h;
    const image = ctx.createImageData(w, h);
    const data = image.data;
    const mode = state.detailMode;

    if (mode === 'biome' && biome) {
      for (let i = 0; i < h * w; i++) writeRGB(data, i * 4, biomeColor(biome[i]));
    } else if (mode === 'temperature' && temp) {
      const [vmin, vmax] = arrayMinMax(temp);
      const span = vmax - vmin || 1;
      for (let i = 0; i < h * w; i++) writeRGB(data, i * 4, heatColor((temp[i] - vmin) / span));
    } else if (mode === 'elevation') {
      const [vmin, vmax] = arrayMinMax(elev);
      const span = vmax - vmin || 1;
      for (let i = 0; i < h * w; i++) writeRGB(data, i * 4, viridisish((elev[i] - vmin) / span));
    } else {
      for (let r = 0; r < h; r++) {
        const r0 = Math.max(0, r - 1), r1 = Math.min(h - 1, r + 1);
        for (let c = 0; c < w; c++) {
          const c0 = Math.max(0, c - 1), c1 = Math.min(w - 1, c + 1);
          const idx = r * w + c;
          const dx = (elev[r * w + c1] - elev[r * w + c0]) * 0.004;
          const dy = (elev[r1 * w + c] - elev[r0 * w + c]) * 0.004;
          const shade = clamp(0.86 - dx * 0.24 - dy * 0.34, 0.42, 1.22);
          writeRGB(data, idx * 4, terrainBaseColor(elev[idx]), shade);
        }
      }
    }

    if (water && mode !== 'biome') {
      for (let i = 0; i < h * w; i++) {
        const strength = water[i];
        if (!strength) continue;
        const frozen = biome && (state.biomes[String(biome[i])] || '').includes('frozen_river');
        const alpha = 0.28 + 0.42 * strength / 255;
        const target = frozen ? [184, 225, 245] : [20, 92, 199];
        const offset = i * 4;
        data[offset] = Math.round(data[offset] * (1 - alpha) + target[0] * alpha);
        data[offset + 1] = Math.round(data[offset + 1] * (1 - alpha) + target[1] * alpha);
        data[offset + 2] = Math.round(data[offset + 2] * (1 - alpha) + target[2] * alpha);
      }
    }

    ctx.putImageData(image, 0, 0);
    detailImg.style.display = 'block';
    detailImg.classList.remove('loading');
    detailSpinner.classList.remove('active');
    detailPlaceholder.style.display = 'none';
  }

  function debouncedLoadCoarse() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadCoarse, 350);
  }

  // ── URL builders ──
  function coarseUrl() {
    const { seed, channel, coarseOffsetI, coarseOffsetJ, coarseWindow } = state;
    const ci0 = coarseOffsetI - coarseWindow, ci1 = coarseOffsetI + coarseWindow;
    const cj0 = coarseOffsetJ - coarseWindow, cj1 = coarseOffsetJ + coarseWindow;
    let url = `/api/coarse.png?channel=${channel}&ci0=${ci0}&ci1=${ci1}&cj0=${cj0}&cj1=${cj1}&_s=${seed}`;
    if (filterEnable.checked) {
      CHANNEL_META.forEach(({ ch }) => {
        const minEl = document.getElementById(`fch-${ch}-min`);
        const maxEl = document.getElementById(`fch-${ch}-max`);
        const lo = parseFloat(minEl.value), hi = parseFloat(maxEl.value);
        if (lo > parseFloat(minEl.min)) url += `&ch${ch}_min=${lo}`;
        if (hi < parseFloat(maxEl.max)) url += `&ch${ch}_max=${hi}`;
      });
    }
    return url;
  }

  function detailUrl() {
    const { seed, detailCI: ci, detailCJ: cj, detailPanI: pi, detailPanJ: pj, detailMode: mode } = state;
    return `/api/detail.png?ci=${ci}&cj=${cj}&detail_size=${DETAIL_SIZE}&pan_i=${pi}&pan_j=${pj}&mode=${mode}&_s=${seed}`;
  }

  // ── Load helpers ──
  function loadCoarse() {
    const req = ++coarseRequestSeq;
    state.coarseData = null;
    coarseImg.dataset.req = String(req);
    coarseImg.classList.add('loading');
    coarseSpinner.classList.add('active');
    coarsePlaceholder.style.display = 'none';
    tileMarker.style.display = 'none';
    originMarker.style.display = 'none';

    if (activeCoarseImageController) activeCoarseImageController.abort();
    clearCoarseImage();

    const src = `${coarseUrl()}&_req=${req}`;
    const controller = new AbortController();
    activeCoarseImageController = controller;

    fetch(src, { signal: controller.signal, cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.blob();
      })
      .then(blob => {
        if (req !== coarseRequestSeq || activeCoarseImageController !== controller) return;
        const url = URL.createObjectURL(blob);
        coarseObjectUrl = url;
        coarseImg.onload = () => {
          if (req !== coarseRequestSeq || activeCoarseImageController !== controller) return;
          coarseImg.style.display = 'block';
          coarseImg.classList.remove('loading');
          coarseSpinner.classList.remove('active');
          const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
          coarseInfo.textContent = `ci=[${oi-w}…${oi+w}], cj=[${oj-w}…${oj+w}]`;
          updateMapMarkers();
          loadCoarseData(req);
        };
        coarseImg.onerror = () => {
          if (req !== coarseRequestSeq || activeCoarseImageController !== controller) return;
          coarseImg.classList.remove('loading');
          coarseSpinner.classList.remove('active');
          statusBar.textContent = 'Error decoding coarse map';
        };
        coarseImg.src = url;
      })
      .catch(err => {
        if (err && err.name === 'AbortError') return;
        if (req !== coarseRequestSeq || activeCoarseImageController !== controller) return;
        coarseImg.classList.remove('loading');
        coarseSpinner.classList.remove('active');
        statusBar.textContent = 'Error loading coarse map';
      });
  }

  async function loadCoarseData(req) {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w, seed } = state;
    const ci0 = oi - w, ci1 = oi + w, cj0 = oj - w, cj1 = oj + w;
    try {
      const res = await fetch(`/api/coarse_data.json?ci0=${ci0}&ci1=${ci1}&cj0=${cj0}&cj1=${cj1}&_s=${seed}&_req=${req}`, { cache: 'no-store' });
      if (!res.ok || req !== coarseRequestSeq) return;
      const data = await res.json();
      if (req === coarseRequestSeq) state.coarseData = data;
    } catch (_) {}
  }

  function loadDetail() {
    if (state.detailCI === null) return;
    const req = ++detailRequestSeq;
    const params = {
      ci: state.detailCI,
      cj: state.detailCJ,
      pi: state.detailPanI,
      pj: state.detailPanJ,
      seed: state.seed,
    };
    state.detailRaw = null;
    if (activeDetailRawController) activeDetailRawController.abort();
    if (activeDetailImageController) activeDetailImageController.abort();
    activeDetailImageController = null;
    clearDetailImage();

    detailImg.dataset.req = String(req);
    detailImg.classList.add('loading');
    detailSpinner.classList.add('active');
    detailPlaceholder.style.display = 'none';
    detailInfo.textContent = `ci=${params.ci}, cj=${params.cj} | pan=(${params.pi},${params.pj})`;

    loadDetailRaw(req, params);
  }

  async function loadDetailRaw(req, params) {
    if (state.detailCI === null || req !== detailRequestSeq) return;
    const { ci, cj, pi, pj, seed } = params;
    const controller = new AbortController();
    activeDetailRawController = controller;
    try {
      const res = await fetch(`/api/detail_raw?ci=${ci}&cj=${cj}&detail_size=${DETAIL_SIZE}&pan_i=${pi}&pan_j=${pj}&_s=${seed}&_req=${req}`, { signal: controller.signal, cache: 'no-store' });
      if (!res.ok || req !== detailRequestSeq || activeDetailRawController !== controller) return;
      const h = parseInt(res.headers.get('X-Height'));
      const w = parseInt(res.headers.get('X-Width'));
      if (!Number.isFinite(h) || !Number.isFinite(w) || h <= 0 || w <= 0) return;
      const hasTemp = res.headers.get('X-Has-Temp') === '1';
      const hasBiome = res.headers.get('X-Has-Biome') === '1';
      const hasWater = res.headers.get('X-Has-Water') === '1';
      const buf = await res.arrayBuffer();
      if (req !== detailRequestSeq || activeDetailRawController !== controller) return;
      const cells = h * w;
      const tempOffset = cells * 2;
      const biomeOffset = tempOffset + (hasTemp ? cells * 2 : 0);
      const waterSurfaceOffset = biomeOffset + cells * 2;
      const waterMaskOffset = waterSurfaceOffset + cells * 2;
      state.detailRaw = {
        elev: new Int16Array(buf, 0, cells),
        temp: hasTemp ? new Int16Array(buf, tempOffset, cells) : null,
        biome: hasBiome ? new Int16Array(buf, biomeOffset, cells) : null,
        waterSurface: hasWater ? new Int16Array(buf, waterSurfaceOffset, cells) : null,
        water: hasWater ? new Uint8Array(buf, waterMaskOffset, cells) : null,
        h, w,
      };
      renderDetailFromRaw();
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (req !== detailRequestSeq || activeDetailRawController !== controller) return;
      detailImg.classList.remove('loading');
      detailSpinner.classList.remove('active');
      statusBar.textContent = 'Error loading detail map';
    } finally {
      if (activeDetailRawController === controller) activeDetailRawController = null;
    }
  }

  // ── Coarse-map markers ──
  function coarseBounds() {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    return { ci0: oi - w, ci1: oi + w, cj0: oj - w, cj1: oj + w };
  }

  function detailViewportCoarse() {
    if (state.detailCI === null) return null;
    const scale = state.coordScale || 1;
    const centerI = state.detailCI + state.detailPanI / (256.0 * scale);
    const centerJ = state.detailCJ + state.detailPanJ / (256.0 * scale);
    const half = DETAIL_SIZE / (512.0 * scale);
    return {
      centerI, centerJ,
      minI: centerI - half, maxI: centerI + half,
      minJ: centerJ - half, maxJ: centerJ + half,
    };
  }

  function updateMapMarkers() {
    updateTileMarker();
    updateOriginMarker();
  }

  function updateTileMarker() {
    const view = detailViewportCoarse();
    if (!view) { tileMarker.style.display = 'none'; return; }
    const { ci0, ci1, cj0, cj1 } = coarseBounds();
    if (view.maxI <= ci0 || view.minI >= ci1 || view.maxJ <= cj0 || view.minJ >= cj1) {
      tileMarker.style.display = 'none';
      return;
    }
    const tI = ci1 - ci0, tJ = cj1 - cj0;
    tileMarker.style.left   = ((view.minJ - cj0) / tJ * 100) + '%';
    tileMarker.style.top    = ((view.minI - ci0) / tI * 100) + '%';
    tileMarker.style.width  = ((view.maxJ - view.minJ) / tJ * 100) + '%';
    tileMarker.style.height = ((view.maxI - view.minI) / tI * 100) + '%';
    tileMarker.style.display = 'block';
  }

  function updateOriginMarker() {
    const origin = state.commandOrigin;
    if (!origin || !Number.isFinite(origin.coarse_i) || !Number.isFinite(origin.coarse_j)) {
      originMarker.style.display = 'none';
      return;
    }
    const { ci0, ci1, cj0, cj1 } = coarseBounds();
    const tI = ci1 - ci0, tJ = cj1 - cj0;
    const xPct = (origin.coarse_j - cj0) / tJ * 100;
    const yPct = (origin.coarse_i - ci0) / tI * 100;
    const inside = xPct >= 0 && xPct <= 100 && yPct >= 0 && yPct <= 100;
    originMarker.className = `origin-marker ${inside ? 'inside' : 'edge'}`;
    originMarker.title = `/td-explore origin x=${Math.round(origin.x)}, z=${Math.round(origin.z)}`;
    if (inside) {
      originMarker.style.left = xPct + '%';
      originMarker.style.top = yPct + '%';
      originMarker.style.removeProperty('--marker-angle');
    } else {
      const clampedX = clamp(xPct, 3, 97);
      const clampedY = clamp(yPct, 3, 97);
      const dx = xPct - clampedX;
      const dy = yPct - clampedY;
      const angle = Math.atan2(dy, dx) + Math.PI / 2;
      originMarker.style.left = clampedX + '%';
      originMarker.style.top = clampedY + '%';
      originMarker.style.setProperty('--marker-angle', `${angle}rad`);
    }
    originMarker.style.display = 'block';
  }

  function syncCoarseToDetailIfNeeded() {
    const view = detailViewportCoarse();
    if (!view) return false;
    const { ci0, ci1, cj0, cj1 } = coarseBounds();
    if (view.minI < ci0 || view.maxI > ci1 || view.minJ < cj0 || view.maxJ > cj1) {
      state.coarseOffsetI = Math.round(view.centerI);
      state.coarseOffsetJ = Math.round(view.centerJ);
      loadCoarse();
      return true;
    }
    return false;
  }

  function normalizeCommandOrigin(raw) {
    if (!raw) return null;
    const origin = {
      x: Number(raw.x),
      z: Number(raw.z),
      coarse_i: Number(raw.coarse_i),
      coarse_j: Number(raw.coarse_j),
    };
    return Number.isFinite(origin.coarse_i) && Number.isFinite(origin.coarse_j) ? origin : null;
  }

  function centerCoarseOnCommandOrigin() {
    const origin = state.commandOrigin;
    if (!origin) return;
    state.coarseOffsetI = Math.round(origin.coarse_i);
    state.coarseOffsetJ = Math.round(origin.coarse_j);
  }

  // ── Tooltip helpers ──
  function showTooltip(e, html) {
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    const x = e.clientX + 18;
    const y = e.clientY - tooltip.offsetHeight / 2;
    tooltip.style.left = Math.min(x, window.innerWidth  - tooltip.offsetWidth  - 8) + 'px';
    tooltip.style.top  = Math.max(8, Math.min(y, window.innerHeight - tooltip.offsetHeight - 8)) + 'px';
  }

  function hideTooltip() { tooltip.style.display = 'none'; }

  // ── Coarse hover ──
  coarseImg.addEventListener('mousemove', (e) => {
    if (!state.coarseData) return;
    const { ci0, ci1, cj0, cj1, channels } = state.coarseData;
    const rect = coarseImg.getBoundingClientRect();
    const ci = Math.floor(ci0 + (e.clientY - rect.top)  / rect.height * (ci1 - ci0));
    const cj = Math.floor(cj0 + (e.clientX - rect.left) / rect.width  * (cj1 - cj0));
    const row = ci - ci0, col = cj - cj0;
    if (row < 0 || row >= ci1 - ci0 || col < 0 || col >= cj1 - cj0) return;
    let html = `<div class="ht-coord">ci=${ci}, cj=${cj}</div>`;
    Object.entries(channels).forEach(([name, data]) => {
      html += `<div class="ht-row"><span class="ht-label">${name}</span><span class="ht-val">${data[row][col].toFixed(1)}</span></div>`;
    });
    showTooltip(e, html);
  });
  coarseImg.addEventListener('mouseleave', hideTooltip);

  // ── Coarse click → load detail ──
  coarseImg.addEventListener('click', (e) => {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    const ci0 = oi - w, ci1 = oi + w, cj0 = oj - w, cj1 = oj + w;
    const rect = coarseImg.getBoundingClientRect();
    state.detailCI = Math.floor(ci0 + (e.clientY - rect.top)  / rect.height * (ci1 - ci0));
    state.detailCJ = Math.floor(cj0 + (e.clientX - rect.left) / rect.width  * (cj1 - cj0));
    state.detailPanI = 0;
    state.detailPanJ = 0;
    updateMapMarkers();
    loadDetail();
    statusBar.textContent = `Selected tile ci=${state.detailCI}, cj=${state.detailCJ}`;
  });

  // ── Detail hover ──
  detailImg.addEventListener('mousemove', (e) => {
    if (!state.detailRaw) return;
    const { elev, temp, biome, water, waterSurface, h, w } = state.detailRaw;
    const rect = detailImg.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / rect.width  * w);
    const row = Math.floor((e.clientY - rect.top)  / rect.height * h);
    if (row < 0 || row >= h || col < 0 || col >= w) return;
    const idx = row * w + col;
    let html = `<div class="ht-row"><span class="ht-label">Elevation</span><span class="ht-val">${elev[idx]} m</span></div>`;
    if (temp) html += `<div class="ht-row"><span class="ht-label">Temperature</span><span class="ht-val">${(temp[idx] / 100).toFixed(2)}°</span></div>`;
    if (biome) {
      const biomeKey = state.biomes[String(biome[idx])] || `#${biome[idx]}`;
      html += `<div class="ht-row"><span class="ht-label">Biome</span><span class="ht-val">${biomeKey}</span></div>`;
    }
    if (water && water[idx] > 0) {
      const level = waterSurface && waterSurface[idx] !== -32768 ? `${waterSurface[idx]} m` : 'n/a';
      html += `<div class="ht-row"><span class="ht-label">Water</span><span class="ht-val">${level} (${water[idx]}/255)</span></div>`;
    }
    showTooltip(e, html);
  });
  detailImg.addEventListener('mouseleave', hideTooltip);

  detailImg.addEventListener('click', (e) => {
    if (!state.detailRaw) return;
    const { h, w } = state.detailRaw;
    const rect = detailImg.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / rect.width  * w);
    const row = Math.floor((e.clientY - rect.top)  / rect.height * h);
    if (row < 0 || row >= h || col < 0 || col >= w) return;
    showDetailCoords(row, col);
  });

  // ── Channel buttons ──
  function buildChannelButtons(names) {
    channelButtons.innerHTML = '';
    names.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.textContent = name;
      if (i === state.channel) btn.classList.add('active');
      btn.addEventListener('click', () => {
        state.channel = i;
        channelButtons.querySelectorAll('button').forEach((b, j) => b.classList.toggle('active', j === i));
        loadCoarse();
      });
      channelButtons.appendChild(btn);
    });
  }

  // ── Detail mode ──
  ['relief', 'elevation', 'temperature', 'biome'].forEach(mode => {
    document.getElementById(`mode-${mode}`).addEventListener('click', () => {
      state.detailMode = mode;
      ['relief','elevation','temperature','biome'].forEach(m =>
        document.getElementById(`mode-${m}`).classList.toggle('active', m === mode));
      if (state.detailRaw) renderDetailFromRaw();
      else loadDetail();
    });
  });

  // ── Seed ──
  btnSetSeed.addEventListener('click', async () => {
    const v = seedInput.value.trim();
    if (!/^-?\d+$/.test(v)) return;
    const res = await fetch('/api/seed', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seed: v }),
    });
    const data = await res.json();
    state.seed = data.seed;
    seedDisplay.textContent = data.seed;
    seedInput.value = '';
    resetDetail();
    loadCoarse();
    statusBar.textContent = `Seed set to ${data.seed}`;
  });

  btnNewSeed.addEventListener('click', async () => {
    const res = await fetch('/api/new_seed', { method: 'POST' });
    const data = await res.json();
    state.seed = data.seed;
    seedDisplay.textContent = data.seed;
    resetDetail();
    loadCoarse();
    statusBar.textContent = `New seed: ${data.seed}`;
  });

  function resetDetail() {
    detailRequestSeq++;
    if (activeDetailRawController) activeDetailRawController.abort();
    if (activeDetailImageController) activeDetailImageController.abort();
    activeDetailImageController = null;
    state.detailCI = state.detailCJ = null;
    state.detailPanI = state.detailPanJ = 0;
    state.detailRaw = null;
    clearDetailImage();
    detailSpinner.classList.remove('active');
    detailPlaceholder.style.display = '';
    detailInfo.textContent = 'click coarse map to load';
    tileMarker.style.display = 'none';
  }

  // ── Filter toggle ──
  filterEnable.addEventListener('change', loadCoarse);

  // ── Stats ──
  btnStats.addEventListener('click', async () => {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    const ci0 = oi - w, ci1 = oi + w, cj0 = oj - w, cj1 = oj + w;
    const res = await fetch(`/api/coarse_stats?ci0=${ci0}&ci1=${ci1}&cj0=${cj0}&cj1=${cj1}`);
    const data = await res.json();
    CHANNEL_META.forEach(({ ch, step }) => {
      if (!data[ch]) return;
      const minEl = document.getElementById(`fch-${ch}-min`);
      const maxEl = document.getElementById(`fch-${ch}-max`);
      const hint  = document.getElementById(`fch-${ch}-hint`);
      minEl.min = minEl.value = data[ch].min;
      minEl.max = data[ch].max;
      minEl.step = step;
      maxEl.min = data[ch].min;
      maxEl.max = maxEl.value = data[ch].max;
      maxEl.step = step;
      if (hint) hint.style.display = 'none';
      // trigger fill update
      minEl.dispatchEvent(new Event('input'));
    });
    const parts = Object.values(data).map(s => `${s.name}: [${s.min}, ${s.max}]`);
    statusBar.textContent = 'Stats — ' + parts.join('  |  ');
  });

  // ── Pan ──
  document.getElementById('coarse-up').addEventListener('click',    () => { state.coarseOffsetI -= COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-down').addEventListener('click',  () => { state.coarseOffsetI += COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-left').addEventListener('click',  () => { state.coarseOffsetJ -= COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-right').addEventListener('click', () => { state.coarseOffsetJ += COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-zoom-in').addEventListener('click', () => setCoarseWindow(Math.round(state.coarseWindow * 0.8)));
  document.getElementById('coarse-zoom-out').addEventListener('click', () => setCoarseWindow(Math.round(state.coarseWindow * 1.25)));

  coarseContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 0.85 : 1.15;
    setCoarseWindow(Math.round(state.coarseWindow * factor));
  }, { passive: false });

  function panDetail(di, dj) {
    if (state.detailCI === null) return;
    state.detailPanI += di;
    state.detailPanJ += dj;
    syncCoarseToDetailIfNeeded();
    updateTileMarker();
    loadDetail();
  }

  document.getElementById('detail-up').addEventListener('click',    () => panDetail(-DETAIL_PAN_STEP, 0));
  document.getElementById('detail-down').addEventListener('click',  () => panDetail( DETAIL_PAN_STEP, 0));
  document.getElementById('detail-left').addEventListener('click',  () => panDetail(0, -DETAIL_PAN_STEP));
  document.getElementById('detail-right').addEventListener('click', () => panDetail(0,  DETAIL_PAN_STEP));

  // ── Biome Config ──
  // Lets the user pick any installed biome (vanilla or modded, enumerated live from the
  // server's real Registries.BIOME by /api/biomes/available), assign it a coarse zone/climate/
  // rarity, and generate + validate + apply a biome_catalog.json rule for it — see
  // ExplorerServer's /api/biomes/* handlers and BiomeRuleGenerator for the server-side logic.
  const bcSearch       = document.getElementById('bc-search');
  const bcList         = document.getElementById('bc-list');
  const bcEditor        = document.getElementById('bc-editor');
  const bcSelectedKeyEl = document.getElementById('bc-selected-key');
  const bcZone         = document.getElementById('bc-zone');
  const bcTemp         = document.getElementById('bc-temp');
  const bcMoisture     = document.getElementById('bc-moisture');
  const bcTree         = document.getElementById('bc-tree');
  const bcRarity       = document.getElementById('bc-rarity');
  const bcPreviewBtn   = document.getElementById('bc-preview');
  const bcApplyBtn     = document.getElementById('bc-apply');
  const bcResult       = document.getElementById('bc-result');

  let bcBiomes = [];
  let bcSelectedBiome = null;
  let bcLastPreviewPassed = false;

  async function loadAvailableBiomes() {
    try {
      const res = await fetch('/api/biomes/available');
      const data = await res.json();
      bcBiomes = data.biomes || [];
      renderBiomeList();
    } catch (e) {
      bcList.innerHTML = '<span class="bc-hint" style="padding:8px;display:block;">Failed to load biome registry.</span>';
    }
  }

  function renderBiomeList() {
    const q = bcSearch.value.trim().toLowerCase();
    const filtered = bcBiomes.filter(b => !q || b.key.toLowerCase().includes(q));
    bcList.innerHTML = '';
    if (filtered.length === 0) {
      bcList.innerHTML = '<span class="bc-hint" style="padding:8px;display:block;">No biomes match.</span>';
      return;
    }
    filtered.slice(0, 400).forEach(b => {
      const row = document.createElement('div');
      row.className = 'bc-item' + (bcSelectedBiome && bcSelectedBiome.key === b.key ? ' selected' : '');
      const badge = b.configured
          ? `<span class="bc-badge configured">${b.ruleCount} rule${b.ruleCount === 1 ? '' : 's'}</span>`
          : '<span class="bc-badge unconfigured">new</span>';
      row.innerHTML = `<span class="bc-key" title="${b.key}">${b.key}</span>${badge}`;
      row.addEventListener('click', () => selectBiome(b));
      bcList.appendChild(row);
    });
  }

  function selectBiome(b) {
    bcSelectedBiome = b;
    bcSelectedKeyEl.textContent = b.configured
        ? `${b.key}  (configured — zones: ${b.zones.join(', ') || '—'}, ${b.ruleCount} rule${b.ruleCount === 1 ? '' : 's'})`
        : `${b.key}  (not configured yet)`;
    bcEditor.style.display = 'flex';
    bcResult.style.display = 'none';
    bcApplyBtn.disabled = true;
    bcLastPreviewPassed = false;
    renderBiomeList();
  }

  bcSearch.addEventListener('input', renderBiomeList);

  function currentBiomeRequest() {
    return {
      biomeKey: bcSelectedBiome.key,
      zone: bcZone.value,
      temperatureBand: bcTemp.value,
      moistureBand: bcMoisture.value,
      treeDensity: bcTree.value,
      rarity: bcRarity.value,
    };
  }

  function renderBcResult(data, isApply) {
    bcResult.style.display = 'flex';
    if (data.error && !data.validation) {
      bcResult.innerHTML = `<div class="bc-status fail">${data.error}</div>`;
      return;
    }
    const passed = !!(data.validation && data.validation.passed);
    const statusClass = passed ? 'pass' : 'fail';
    const statusText = isApply
        ? (data.applied ? 'APPLIED ✓ — written to biome_catalog.json' : 'APPLY REFUSED — validation failed')
        : (passed ? 'VALID — ready to apply' : 'INVALID — cannot apply');
    let findingsHtml = '';
    if (data.validation && data.validation.findings && data.validation.findings.length) {
      findingsHtml = '<div class="bc-hint">' +
          data.validation.findings.map(f => '⚠ ' + f).join('<br>') + '</div>';
    }
    const anchorHtml = data.anchor
        ? `<div class="bc-hint">Shares priority tier ${data.anchor.priority} with <b>${data.anchor.biomeKey}</b>, disambiguated by a noise gate.</div>`
        : `<div class="bc-hint">No overlapping biome found — assigned its own new priority tier (${data.priority}).</div>`;
    bcResult.innerHTML = `
      <div class="bc-status ${statusClass}">${statusText}</div>
      ${anchorHtml}
      <div class="bc-hint">index=${data.assignedIndex} · priority=${data.priority} · newBiome=${data.newSettlement}</div>
      ${findingsHtml}
      <pre>${JSON.stringify(data.rule, null, 2)}</pre>
    `;
  }

  bcPreviewBtn.addEventListener('click', async () => {
    if (!bcSelectedBiome) return;
    bcPreviewBtn.disabled = true;
    try {
      const res = await fetch('/api/biomes/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentBiomeRequest()),
      });
      const data = await res.json();
      renderBcResult(data, false);
      bcLastPreviewPassed = !!(data.validation && data.validation.passed);
      bcApplyBtn.disabled = !bcLastPreviewPassed;
    } catch (e) {
      bcResult.style.display = 'flex';
      bcResult.innerHTML = `<div class="bc-status fail">Request failed: ${e}</div>`;
    } finally {
      bcPreviewBtn.disabled = false;
    }
  });

  bcApplyBtn.addEventListener('click', async () => {
    if (!bcSelectedBiome || !bcLastPreviewPassed) return;
    bcApplyBtn.disabled = true;
    try {
      const res = await fetch('/api/biomes/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentBiomeRequest()),
      });
      const data = await res.json();
      renderBcResult(data, true);
      if (data.applied) {
        bcLastPreviewPassed = false;
        await loadAvailableBiomes();
      }
    } catch (e) {
      bcResult.style.display = 'flex';
      bcResult.innerHTML = `<div class="bc-status fail">Request failed: ${e}</div>`;
    } finally {
      bcApplyBtn.disabled = !bcLastPreviewPassed;
    }
  });

  // ── Init ──
  async function init() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      state.seed = data.seed;
      state.channels = data.channels;
      state.biomes = data.biomes || {};
      state.biomeColors = data.biome_colors || {};
      state.commandOrigin = normalizeCommandOrigin(data.command_origin);
      state.nativeResolution = data.native_resolution ?? state.nativeResolution;
      // Scale is fixed to the mod's configured value (blocks per native pixel)
      state.coordScale = data.scale || 1;
      centerCoarseOnCommandOrigin();
      seedDisplay.textContent = data.seed;
      buildChannelButtons(data.channels);
      updateCoordScale();
      updateCoarseZoomLabel();
      statusBar.textContent = `Connected — seed ${data.seed} | scale ${data.scale}×`;
      loadCoarse();
    } catch (e) {
      statusBar.textContent = 'Failed to connect to server';
    }
  }

  init();
  loadAvailableBiomes();
</script>
</body>
</html>
