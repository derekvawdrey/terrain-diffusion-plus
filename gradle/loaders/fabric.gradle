def buildVariant = project.ext.has('terrainDiffusionBuildVariant')
        ? project.ext.terrainDiffusionBuildVariant
        : rootProject.ext.terrainDiffusionBuildVariant(project)
project.ext.terrainDiffusionBuildVariant = buildVariant

// Runtime JVM memory for Fabric dev runs. These settings affect runClient/runServer,
// unlike org.gradle.jvmargs which only affects Gradle itself.
def terrainDiffusionMinecraftRunXms = (findProperty('minecraft_run_xms')
        ?: rootProject.findProperty('minecraft_run_xms')
        ?: '8G').toString()
def terrainDiffusionMinecraftRunXmx = (findProperty('minecraft_run_xmx')
        ?: rootProject.findProperty('minecraft_run_xmx')
        ?: '12G').toString()
def terrainDiffusionMinecraftRunHeapDump = (findProperty('minecraft_run_heap_dump')
        ?: rootProject.findProperty('minecraft_run_heap_dump')
        ?: 'false').toString().equalsIgnoreCase('true')

loom {
    def aw = terrainDiffusionCommonFile("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    splitEnvironmentSourceSets()

    mods {
        "terrain-diffusion-mc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        configureEach {
            ideConfigGenerated true
            vmArgs "-Xms${terrainDiffusionMinecraftRunXms}",
                    "-Xmx${terrainDiffusionMinecraftRunXmx}",
                    '-XX:+UseG1GC',
                    '-XX:MaxGCPauseMillis=200',
                    terrainDiffusionMinecraftRunHeapDump
                            ? '-XX:+HeapDumpOnOutOfMemoryError'
                            : '-XX:-HeapDumpOnOutOfMemoryError'
        }
        client {
            client()
            setConfigName('Fabric Client')
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            runDir('runs/server')
        }
    }
}

sourceSets {
    client {
        java {
            setSrcDirs([])
            terrainDiffusionAddCommonOverlay(delegate, 'client', 'java')
            terrainDiffusionAddLoaderOverlay(delegate, project.name, 'client', 'java')
        }
        resources {
            setSrcDirs([])
            terrainDiffusionAddVersionOnlyCommonResources(delegate, 'client')
            terrainDiffusionAddLoaderOverlay(delegate, project.name, 'client', 'resources')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.fabric_loader_version
    inputs.property 'build_variant', buildVariant
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.fabric_loader_version
    }
    filesMatching('build-variant.properties') {
        expand 'build_variant': buildVariant
    }
}


jar {
    def licenseFile = terrainDiffusionRootFile('LICENSE')
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "${it}_${project.archivesBaseName}" }
        }
    }
}

// Keep the development jar and the remapped distribution jar as two distinct
// files. If both tasks write to the same path, Loom can end up remapping its own
// output and leave a tiny placeholder jar in build/libs.
tasks.named('jar', Jar).configure { Jar jarTask ->
    archiveClassifier.set('dev')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('classes')
    from(sourceSets.main.output)

    if (sourceSets.findByName('client') != null) {
        dependsOn tasks.named('clientClasses')
        from(sourceSets.client.output)
    }
}

tasks.named('remapJar').configure { Task remapTask ->
    dependsOn tasks.named('jar')
    inputFile.set(tasks.named('jar', Jar).flatMap { Jar jarTask -> jarTask.archiveFile })

    if (remapTask.hasProperty('archiveClassifier')) {
        remapTask.archiveClassifier.set('')
    }
}


tasks.withType(JavaExec).configureEach {
    systemProperty 'log4j2.configurationFile', terrainDiffusionRootFile('log4j2-dev.xml').absolutePath
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
        }
    }
    repositories {
    }
}

tasks.register('pipelineTest', JavaExec) {
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.xandergos.terraindiffusionmc.pipeline.PipelineTest'
    jvmArgs '-Xmx8g'
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

tasks.register('terrainDiffusionEnsureFabricClientResourcesDir') {
    outputs.dir(layout.buildDirectory.dir('resources/client'))
    doLast {
        layout.buildDirectory.dir('resources/client').get().asFile.mkdirs()
    }
}

tasks.matching { Task task -> task.name == 'runClient' }.configureEach { Task task ->
    task.dependsOn(tasks.named('terrainDiffusionEnsureFabricClientResourcesDir'))
}


