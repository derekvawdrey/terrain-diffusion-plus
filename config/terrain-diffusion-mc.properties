# Terrain Diffusion MC configuration

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Offload inactive models from VRAM so only one model occupies the GPU at a time.
# Keeps peak VRAM to 1.5-2 GB. Set to false if you have ~2.5+ GB of free VRAM for
# slightly faster generation (avoids reloading sessions between pipeline stages).
inference.offload_models=auto

# Overlap between neighbouring model windows. 'reduced' widens the decoder stride
# (192 -> 224); the latent stride is fixed at 32 because the latent stage's coarse
# conditioning window advances in whole coarse cells per tile. The blend has less margin
# to hide a decoder window seam. Changes generated terrain: pick it before creating a world.
inference.window_overlap=reduced

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# Port for the local terrain explorer web UI (started with /td-explore command).
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Hard cap for generated heightmap/biome regions retained in Java heap.
# Lower values reduce RAM pressure while exploring/generating many chunks.
terrain_cache.max_mib=32
terrain_cache.max_entries=16

# Per-stage InfiniteTensor window cache cap in Java heap.
# There are separate coarse, latent, and decoder tensor caches.
# One hydrology tile's decoder windows are about 30 MiB, and neighbouring tiles overlap, so
# a cap that holds several tiles' worth lets an exploring player reuse windows instead of
# re-running the models over them: 128 keeps roughly four tiles and generates a revisited
# neighbourhood about 7% faster than 32. Generated terrain is identical either way.
pipeline_cache.tensor_max_mib=128

# Canonical hydrology grid. Rivers/lakes are generated once per fixed world tile,
# then reused by both the explorer and Minecraft chunk generation.
# Changing hydrology.tile_size or hydrology.analysis_halo changes the generated river network.
hydrology.tile_size=2048
hydrology.analysis_halo=128

# Compact memory cache. A 8192x8192 tile uses about 112 MiB after generation.
hydrology.cache.max_mib=640
hydrology.cache.max_entries=20

# Persist compact canonical tiles under terrain-diffusion-cache/hydrology in the game directory.
# Disable this only when disk space is more important than avoiding regeneration after restarts.
hydrology.disk_cache.enabled=false
# Change this value after replacing custom model files to avoid reusing tiles from the old model.
hydrology.disk_cache.namespace=default

# Coarse drainage: latent-resolution river load computed once per super-tile (a block of
# canonical hydrology tiles) and used to carry upstream river load across canonical tile
# boundaries. It is regenerated automatically when the hydrology layout changes.
coarse_drainage.cache.max_mib=320
coarse_drainage.cache.max_entries=32

# Persist coarse drainage tiles under terrain-diffusion-cache/coarse-drainage in the game directory.
coarse_drainage.disk_cache.enabled=false
# Change this value after replacing custom model files to avoid reusing tiles from the old model.
coarse_drainage.disk_cache.namespace=default

# Build the coarse drainage super-tile for a neighbouring region during idle time, so
# crossing into it does not stall a chunk with a whole drainage pass. Warming runs only
# when no tile has been generated for a few seconds, so it uses GPU time that would
# otherwise go unused. Generated terrain is identical either way.
coarse_drainage.prefetch=true

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128
