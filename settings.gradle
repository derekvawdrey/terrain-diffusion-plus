pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'terrain-diffusion-mc'

includeBuild('versions/1.20.1') { name = 'tdmc_1_20_1' }
includeBuild('versions/1.21.1') { name = 'tdmc_1_21_1' }
includeBuild('versions/1.21.11') { name = 'tdmc_1_21_11' }
