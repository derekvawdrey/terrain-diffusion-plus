# Terrain Diffusion MC configuration

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Whether inactive models are offloaded from VRAM between pipeline stages.
# "auto"  keeps all three models resident when the GPU has room (needs ~2.5 GB) and
#         falls back to offloading if it does not. Offloading reloads a session on every
#         stage switch, which costs roughly 0.8 s per generated tile.
# "true"  always offloads: only one model in VRAM at a time, peak 1.5-2 GB.
# "false" always keeps them resident, and fails at startup if they do not fit.
inference.offload_models=auto

# Concurrent region computations. 0 = automatic: 1 while models are being offloaded
# (GPU-slot swapping already serializes inference; more threads would only add queuing
# overhead and risk swap thrashing between models), otherwise 2, so one region's river
# and biome passes can use the CPU while another's inference uses the GPU. Each
# concurrent region costs roughly 0.6 GB of heap.
inference.worker_threads=0

# Overlap between neighbouring model windows.
# "full"    each latent pixel is generated four times and blended: no visible window
#           seams, and the shipped terrain.
# "reduced" wider decoder stride (192 -> 224): faster generation with less margin for
#           the blend to hide a window boundary. The latent stride is fixed at 32: the
#           latent stage's coarse conditioning walks whole coarse cells per tile index,
#           so a wider latent stride slides conditioning off the terrain it describes.
# Like hydrology.tile_size this changes generated terrain: pick it before creating a
# world, keep it for that world's lifetime, and keep it equal across installs sharing
# a world or hydrology cache.
inference.window_overlap=reduced

# Decoder tiles per model call. Higher values generate terrain faster but peak decoder
# VRAM grows by roughly 650 MiB per extra tile (2 fits the default ~2 GB envelope;
# use 4-8 on GPUs with 4+ GB free). Set to 1 to disable batching if you run out of VRAM.
# Like hydrology.tile_size, this slightly changes generated terrain: keep the same value
# across installs sharing a world, and avoid changing it for an existing world.
inference.decoder_batch_size=2

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# Port for the local terrain explorer web UI (started with /td-explore command).
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Hard cap for generated heightmap/biome regions retained in Java heap.
# Lower values reduce RAM pressure while exploring/generating many chunks.
terrain_cache.max_mib=32
terrain_cache.max_entries=16

# Per-stage InfiniteTensor window cache cap in Java heap.
# There are separate coarse, latent, and decoder tensor caches.
# One hydrology tile's decoder windows are about 30 MiB, and neighbouring tiles overlap, so
# a cap that holds several tiles' worth lets an exploring player reuse windows instead of
# re-running the models over them: 128 keeps roughly four tiles and generates a revisited
# neighbourhood about 7% faster than 32. Generated terrain is identical either way.
pipeline_cache.tensor_max_mib=128

# Canonical hydrology grid. Rivers/lakes are generated once per fixed world tile,
# then reused by both the explorer and Minecraft chunk generation.
# Changing hydrology.tile_size or hydrology.analysis_halo changes the generated river network.
hydrology.tile_size=2048
hydrology.analysis_halo=128
# 0 = automatic: use every logical CPU except one reserved for the game/server.
hydrology.worker_threads=0

# Compact memory cache. An 8192x8192 tile uses about 448 MiB after generation.
hydrology.cache.max_mib=640
hydrology.cache.max_entries=20

# Persist compact canonical tiles under terrain-diffusion-cache/hydrology in the game directory.
# Disable this only when disk space is more important than avoiding regeneration after restarts.
hydrology.disk_cache.enabled=true
# Change this value after replacing custom model files to avoid reusing tiles from the old model.
hydrology.disk_cache.namespace=default

# Coarse drainage: latent-resolution river load computed once per super-tile (a block of
# canonical hydrology tiles) and used to carry upstream river load across canonical tile
# boundaries. It is regenerated automatically when the hydrology layout changes.
coarse_drainage.cache.max_mib=320
coarse_drainage.cache.max_entries=32

# Persist coarse drainage tiles under terrain-diffusion-cache/coarse-drainage in the game directory.
coarse_drainage.disk_cache.enabled=true
# Change this value after replacing custom model files to avoid reusing tiles from the old model.
coarse_drainage.disk_cache.namespace=default

# Build the coarse drainage super-tile for a neighbouring region in the background, so
# crossing into it does not stall a chunk with a whole drainage pass. Warming runs only
# while no chunk is waiting on terrain, so it uses GPU time that would otherwise go
# unused. Generated terrain is identical either way.
coarse_drainage.prefetch=true

# Build the canonical hydrology tile the player is heading into before a chunk asks for it.
# A tile covers 2048 blocks and takes a couple of seconds to build, so without this the
# first chunk across a tile boundary stalls for that long. Exactly one tile is built per
# crossing, in the direction of travel, and only while no chunk is waiting on terrain --
# warming more than that costs more in contention than the avoided stall saves.
# Generated terrain is identical either way.
terrain_prefetch.enabled=true

# Warm mountain belts. Normally temperature falls with elevation at the regressed lapse
# rate (about -6.5 C/km), so every high range ends up cold and snowy. Inside belts drawn
# by the same large-wavelength region field that gates rare biomes (about a fifth of the
# world, 7% at full strength) the slope above sea level is eased towards lapse_c_per_km,
# so a 3000 m range that would sit near -5 C reads as temperate instead and takes forest,
# meadow or savanna plateau rather than snowy slopes. Sea level is unchanged and the
# effect grows with height. Inside a belt this changes biomes and, because warmer ground
# sheds slightly less runoff, the rivers' width and carving; the model's terrain and every
# region outside the belts are untouched. Like hydrology.tile_size it changes generated
# terrain: pick it before creating a world and keep it for that world's lifetime.
climate.warm_mountains.enabled=true
climate.warm_mountains.lapse_c_per_km=-1.5

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128

# Procedural surface structures (boulders, hoodoo clusters, arches, ...) placed during
# chunk decoration, on top of the diffusion terrain. Disable if you only want vanilla features.
surface_features.enabled=true

# --- Snow ---

# Snow lies deeper the colder the ground is, from the terrain model's own temperature: one layer
# where snow only just settles, 1-7 layers between -3 and -7 C, then a snow block plus 1-7
# layers down to -12 C. Snow on a tree canopy also snows the ground beneath. Decoration only:
# changing it affects newly generated chunks and nothing already built.
snow.depth_scaling=true

# Layer cap where the snow sits on a block that keeps a plant alive under it (a block entity), so
# a mod such as Snow Real Magic can keep tending it; keep equal to its accumulation.maxLayers.
snow.max_layers_over_vegetation=6

# --- Caves ---

# Carvers are how vanilla, every cave mod and every datapack cut caves, and they are authored for
# a world whose surface sits around y=64..140. World scale stretches terrain above sea level, so
# left alone a carver cuts a band near the world floor and leaves the mountains above it solid.
# Their altitudes are therefore moved by the same factor the terrain moved; cave shape, size,
# frequency and block choice are untouched, and nothing at all happens at world scale 1.
# Set to false to run every carver exactly at its authored altitudes.
caves.lift_carvers=true

# When a carver's altitude range is stretched, raise its per-chunk spawn chance by the same factor,
# so caves stay as frequent per vertical slab of world -- and cave mouths as frequent on a
# mountainside -- as their author intended. Without this a tall world gets vanilla's *number* of
# cave systems spread over several times the height.
# Applies only to carvers that place discrete cave systems from a spawn chance. Carvers that fill a
# chunk from noise already scale with the band they are given.
caves.density_compensation=true

# YUNG's Better Caves is bundled inside this jar, so it cannot be taken out of the mods folder.
# Set to false to turn it off: its carvers are dropped from every biome and vanilla's caves are put
# back -- unless another cave mod's carver is already there, in which case that mod's caves are the
# ones that generate.
caves.bundled_cave_mod=true

# A cave band authored to reach the surface is run all the way to the top of the world, not just
# to where its lifted top lands. Lifting keeps a band's proportions but the terrain does not:
# vanilla's caves stop at y=180 and Better Caves' at y=80, which at world scale 2 land at y=297
# and y=97 under summits around y=400-550, leaving most of every mountain solid. With this on, every
# band whose authored top is above sea level runs to the summit (spawn-chance carvers keep their
# density per slab through density_compensation). Bands that stay below sea level -- the deep
# caverns -- are never touched. Set to false to stop caves where the lifted band ends.
caves.reach_summits=true

# Large caverns inside the mountains. Better Caves keeps its big caverns near the world floor, so
# even with its cave band reaching the summit a mountain holds only winding tunnels. This gives
# its carver one more cavern layer: a clone of its own first cavern layer (so the caverns keep
# the mod's, or a pack's, tuning) with the band moved to y=177 (at world scale 2) up to the
# summit. Lowland terrain never reaches the band. chance is the share of cavern regions in that
# layer that hold caverns, 0..100; Better Caves' deep layer ships at 23.
caves.mountain_caverns=true
caves.mountain_caverns.chance=30

# Noise caves: vanilla's cheese caverns, spaghetti tunnels, noodle caves and cave entrances,
# cut in the density function the way vanilla cuts them and extended to the full height of
# this world, so they reach mountain summits. "auto" turns them on unless YUNG's Better Caves
# is present and enabled (the two together would hollow the world out); "true" and "false"
# force it. Changes which caves generate: pick it before creating a world and keep it.
caves.noise_caves=auto

# These settings change which caves are generated, so pick them before creating a world
# and keep them for that world's lifetime. A pack can declare the altitudes of a carver this mod
# does not know, or opt one out of being moved at all, in
# config/terrain-diffusion-mc/carver_altitudes.json -- see the README.
